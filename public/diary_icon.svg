<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B4F3B"/>
      <stop offset="100%" stop-color="#3E2C20"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="256" cy="470" rx="160" ry="18" fill="#00000022"/>

  <!-- Back cover -->
  <rect x="120" y="70" width="250" height="340" rx="16" fill="#5a4333"/>

  <!-- Pages -->
  <rect x="135" y="80" width="245" height="330" rx="12" fill="#f7f2e8"/>
  <g stroke="#d7d1c7" stroke-width="2">
    <line x1="160" y1="120" x2="360" y2="120"/>
    <line x1="160" y1="155" x2="360" y2="155"/>
    <line x1="160" y1="190" x2="360" y2="190"/>
    <line x1="160" y1="225" x2="360" y2="225"/>
    <line x1="160" y1="260" x2="360" y2="260"/>
    <line x1="160" y1="295" x2="360" y2="295"/>
    <line x1="160" y1="330" x2="360" y2="330"/>
  </g>

  <!-- Front cover -->
  <rect x="100" y="60" width="250" height="350" rx="18" fill="url(#cover)"/>

  <!-- Spine -->
  <rect x="100" y="60" width="28" height="350" rx="10" fill="#2e2118"/>
  <g fill="#b08d57">
    <circle cx="114" cy="110" r="4"/>
    <circle cx="114" cy="160" r="4"/>
    <circle cx="114" cy="210" r="4"/>
    <circle cx="114" cy="260" r="4"/>
    <circle cx="114" cy="310" r="4"/>
    <circle cx="114" cy="360" r="4"/>
  </g>

  <!-- Bookmark -->
  <path d="M330 60 L350 60 L350 170 L340 155 L330 170 Z" fill="#b22222"/>

  <!-- Emblem -->
  <circle cx="225" cy="195" r="48" fill="#c9a86a" stroke="#e9d2a1" stroke-width="4"/>
  <path d="M225 165
           C215 180 195 190 195 210
           C195 230 210 245 225 245
           C240 245 255 230 255 210
           C255 190 235 180 225 165Z"
        fill="#fff4d6"/>

  <!-- Title -->
  <text x="225" y="300"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="28"
        fill="#f8f2e7"
        letter-spacing="2">DIARY</text>
</svg>
